<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crafters Gallery Designer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Canvas ── */
#canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #16213e;
  position: relative;
  overflow: hidden;
}
#canvas-bg {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(45deg, #1a1a2e 25%, transparent 25%),
    linear-gradient(-45deg, #1a1a2e 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #1a1a2e 75%),
    linear-gradient(-45deg, transparent 75%, #1a1a2e 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  background-color: #202040;
  opacity: 0.5;
}
#jockey-svg {
  position: relative;
  max-height: 90vh;
  max-width: 100%;
  filter: drop-shadow(0 8px 32px rgba(0,0,0,0.7));
}
#jockey-svg [data-part] { cursor: pointer; }
#jockey-svg [data-part]:hover path,
#jockey-svg [data-part]:hover ellipse { opacity: 0.85; }

/* Non-scaling strokes so width is always in screen pixels regardless of transform */
#jockey-svg [data-part] path,
#jockey-svg [data-part] ellipse {
  vector-effect: non-scaling-stroke;
  stroke-width: 1.5px !important;
}
#jockey-svg #shadows path,
#jockey-svg #shadows ellipse {
  vector-effect: non-scaling-stroke;
  stroke-width: 0.4px !important;
}

/* selection ring drawn via JS overlay rect */
#sel-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ── Panel ── */
#panel {
  width: 300px;
  min-width: 300px;
  background: #0d1b2a;
  display: flex;
  flex-direction: column;
  border-left: 1px solid #1a3a5c;
  overflow: hidden;
}
#panel-header {
  padding: 14px 16px;
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  flex-shrink: 0;
}

/* ── Tabs ── */
#tabs {
  display: flex;
  border-bottom: 1px solid #1a3a5c;
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  text-align: center;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #5a7a9a;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab.active { color: #e74c3c; border-bottom-color: #e74c3c; }
.tab:hover:not(.active) { color: #ccc; }

/* ── Parts tab ── */
#tab-parts { overflow-y: auto; flex: 1; padding: 8px; }
.part-group-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #3a5a7a;
  padding: 8px 6px 4px;
}
.part-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 7px 10px;
  background: none;
  border: 1px solid transparent;
  color: #9ab;
  cursor: pointer;
  font-size: 12px;
  border-radius: 4px;
  margin-bottom: 1px;
  transition: all 0.12s;
}
.part-btn:hover { background: #1a3a5c; color: #ddd; border-color: #2a4a6c; }
.part-btn.active { background: #1a2a4a; color: #fff; border-color: #e74c3c; }
.part-swatch {
  width: 14px; height: 14px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
}

/* ── Edit tab ── */
#tab-edit {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#no-selection {
  color: #3a5a7a;
  font-size: 13px;
  text-align: center;
  padding: 40px 20px;
  line-height: 1.6;
}
#no-selection b { color: #5a8aaa; }

#edit-controls { display: none; }

.section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #3a6a9a;
  margin-bottom: 6px;
}
.selected-name {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 2px;
}

/* Fill mode toggle */
.mode-toggle {
  display: flex;
  background: #0a1520;
  border-radius: 5px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  flex: 1;
  padding: 6px 8px;
  border: none;
  background: none;
  color: #5a7a9a;
  cursor: pointer;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.12s;
}
.mode-btn.active {
  background: #e74c3c;
  color: #fff;
}

/* Color input */
.color-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.color-row label { font-size: 12px; color: #7a9ab5; flex: 1; }
input[type="color"] {
  width: 48px;
  height: 28px;
  border: 1px solid #2a4a6c;
  border-radius: 3px;
  background: #0a1520;
  cursor: pointer;
  padding: 1px 2px;
}

/* Preset swatches */
.preset-swatch {
  width: 32px; height: 32px;
  border-radius: 4px;
  border: 2px solid rgba(255,255,255,0.15);
  cursor: pointer;
  transition: border-color 0.12s, transform 0.1s;
  flex-shrink: 0;
}
.preset-swatch:hover { transform: scale(1.12); border-color: rgba(255,255,255,0.5); }
.preset-swatch.active { border-color: #00d4ff; }

/* Canvas color picker */
#sv-wrap { position: relative; margin-bottom: 8px; }
#sv-canvas { display: block; border-radius: 4px; cursor: crosshair; width: 100%; }
#sv-handle {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.7);
  transform: translate(-50%, -50%);
  pointer-events: none;
}
#picker-preview-circle {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 2px solid #2a4a6c;
  flex-shrink: 0;
}
#hue-strip-wrap { flex: 1; position: relative; height: 16px; }
#hue-strip { display: block; border-radius: 8px; width: 100%; height: 16px; cursor: pointer; }
#hue-handle {
  position: absolute;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.7);
  transform: translate(-50%, -50%);
  top: 50%; left: 0;
  pointer-events: none;
}
.picker-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rgb-field { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.rgb-field input[type="number"] {
  width: 100%;
  background: #1a2a3a;
  border: 1px solid #2a4a6c;
  border-radius: 4px;
  color: #e0e0e0;
  font-size: 13px;
  text-align: center;
  padding: 5px 2px;
  -moz-appearance: textfield;
}
.rgb-field input[type="number"]::-webkit-outer-spin-button,
.rgb-field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.rgb-field label { font-size: 10px; color: #5a8aaa; text-transform: uppercase; letter-spacing: 1px; }

/* Pattern grid */
.pattern-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}
.pat-thumb {
  aspect-ratio: 1;
  border: 2px solid #1a3a5c;
  border-radius: 4px;
  cursor: pointer;
  overflow: hidden;
  background: #0a1520;
  transition: border-color 0.12s;
  position: relative;
}
.pat-thumb:hover { border-color: #3a6a9a; }
.pat-thumb.active { border-color: #e74c3c; }
.pat-thumb svg { width: 100%; height: 100%; display: block; }
.pat-thumb span {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  text-align: center;
  font-size: 7px;
  background: rgba(0,0,0,0.6);
  color: #aaa;
  padding: 1px;
}

/* Sliders */
.slider-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.slider-header label { font-size: 12px; color: #7a9ab5; }
.slider-header .val { font-size: 11px; color: #e74c3c; font-weight: 600; min-width: 36px; text-align: right; }
input[type="range"] {
  width: 100%;
  height: 4px;
  accent-color: #e74c3c;
  cursor: pointer;
}

/* Two columns */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Divider */
.divider { border: none; border-top: 1px solid #1a3a5c; }

/* Footer */
#panel-footer {
  padding: 12px;
  border-top: 1px solid #1a3a5c;
  flex-shrink: 0;
  display: flex;
  gap: 8px;
}
.action-btn {
  flex: 1;
  padding: 9px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: opacity 0.12s;
}
.action-btn:hover { opacity: 0.85; }
.btn-primary { background: #e74c3c; color: white; }
.btn-secondary { background: #1a3a5c; color: #9ab; }
</style>
</head>

    <div class="tab" id="tab-btn-edit" onclick="switchTab('edit')">Edit</div>
    <div class="tab" id="tab-btn-logo" onclick="switchTab('logo')">Logo</div>
  </div>

  <!-- Parts list -->
  <div id="tab-parts">
    <div class="part-group-label">Hat</div>
    <button class="part-btn" id="listbtn-hatbutton" onclick="selectPart('hatbutton')"><span class="part-swatch" id="sw-hatbutton"></span>Hat Button</button>
    <button class="part-btn" id="listbtn-hatbase" onclick="selectPart('hatbase')"><span class="part-swatch" id="sw-hatbase"></span>Hat Base</button>
    <button class="part-btn" id="listbtn-fpanel" onclick="selectPart('fpanel')"><span class="part-swatch" id="sw-fpanel"></span>Front Panel</button>
    <button class="part-btn" id="listbtn-bpanel" onclick="selectPart('bpanel')"><span class="part-swatch" id="sw-bpanel"></span>Back Panel</button>
    <button class="part-btn" id="listbtn-hatbill" onclick="selectPart('hatbill')"><span class="part-swatch" id="sw-hatbill"></span>Hat Bill</button>

    <div class="part-group-label">Head</div>
    <button class="part-btn" id="listbtn-hair" onclick="selectPart('hair')"><span class="part-swatch" id="sw-hair"></span>Hair</button>
    <button class="part-btn" id="listbtn-skin" onclick="selectPart('skin')"><span class="part-swatch" id="sw-skin"></span>Skin</button>

    <div class="part-group-label">Upper Body</div>
    <button class="part-btn" id="listbtn-collar" onclick="selectPart('collar')"><span class="part-swatch" id="sw-collar"></span>Collar</button>
    <button class="part-btn" id="listbtn-shirt" onclick="selectPart('shirt')"><span class="part-swatch" id="sw-shirt"></span>Shirt</button>
    <button class="part-btn" id="listbtn-buttons" onclick="selectPart('buttons')"><span class="part-swatch" id="sw-buttons"></span>Buttons</button>
    <button class="part-btn" id="listbtn-sleeves" onclick="selectPart('sleeves')"><span class="part-swatch" id="sw-sleeves"></span>Sleeves</button>
    <button class="part-btn" id="listbtn-shirtcuffs" onclick="selectPart('shirtcuffs')"><span class="part-swatch" id="sw-shirtcuffs"></span>Shirt Cuffs</button>

    <div class="part-group-label">Lower Body</div>
    <button class="part-btn" id="listbtn-pants" onclick="selectPart('pants')"><span class="part-swatch" id="sw-pants"></span>Pants</button>
    <button class="part-btn" id="listbtn-bootcuffs" onclick="selectPart('bootcuffs')"><span class="part-swatch" id="sw-bootcuffs"></span>Boot Cuffs</button>
    <button class="part-btn" id="listbtn-boots" onclick="selectPart('boots')"><span class="part-swatch" id="sw-boots"></span>Boots</button>

    <div class="part-group-label">Environment</div>
    <button class="part-btn" id="listbtn-floor" onclick="selectPart('floor')"><span class="part-swatch" id="sw-floor"></span>Floor</button>
    <button class="part-btn" id="listbtn-base" onclick="selectPart('base')"><span class="part-swatch" id="sw-base"></span>Base</button>
    <button class="part-btn" id="listbtn-ring" onclick="selectPart('ring')"><span class="part-swatch" id="sw-ring"></span>Ring</button>
  </div>

  <!-- Edit panel -->
  <div id="tab-edit" style="display:none;">
    <div id="no-selection">
      Click a part on the figure<br>or select from the <b>Parts</b> list
    </div>

    <div id="edit-controls">
      <div class="selected-name" id="edit-title"></div>
      <div id="fill-type-section">
        <div class="section-label">Fill Type</div>
        <div class="mode-toggle">
          <button class="mode-btn active" id="mode-solid" onclick="setMode('solid')">Solid</button>
          <button class="mode-btn" id="mode-pattern" onclick="setMode('pattern')">Pattern</button>
        </div>
      </div>

      <!-- Solid controls -->
      <div id="solid-section">
        <!-- Preset palette (shown for parts that have presets) -->
        <div id="preset-palette" style="display:none;">
          <div class="section-label" style="margin-top:4px;">Presets</div>
          <div id="preset-swatches" style="display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px;"></div>
        </div>
        <!-- Canvas color picker (hidden for presetsOnly parts) -->
        <div id="color-picker-section">
          <div id="sv-wrap">
            <canvas id="sv-canvas" width="276" height="160"></canvas>
            <div id="sv-handle"></div>
          </div>
          <div class="picker-row">
            <div id="picker-preview-circle"></div>
            <div id="hue-strip-wrap">
              <canvas id="hue-strip" width="200" height="16"></canvas>
              <div id="hue-handle"></div>
            </div>
          </div>
          <div class="picker-row">
            <div class="rgb-field"><input type="number" id="inp-r" min="0" max="255" value="0" oninput="onRgbInput()"><label>R</label></div>
            <div class="rgb-field"><input type="number" id="inp-g" min="0" max="255" value="0" oninput="onRgbInput()"><label>G</label></div>
            <div class="rgb-field"><input type="number" id="inp-b" min="0" max="255" value="0" oninput="onRgbInput()"><label>B</label></div>
          </div>
          <input type="color" id="solid-color" style="display:none;" oninput="onColorWheelChange(this.value)">
        </div>
      </div>

      <!-- Pattern controls -->
      <div id="pattern-section" style="display:none;">
        <div class="section-label">Pattern</div>
        <div class="pattern-grid" id="pattern-grid"></div>

        <hr class="divider">

        <div class="section-label">Colors</div>
        <div class="two-col">
          <div>
            <div class="color-row">
              <label>Base</label>
              <input type="color" id="pat-c1" value="#ffffff" oninput="onPatternChange()">
            </div>
          </div>
          <div>
            <div class="color-row">
              <label>Pattern</label>
              <input type="color" id="pat-c2" value="#cc0000" oninput="onPatternChange()">
            </div>
          </div>
        </div>

        <hr class="divider">

        <div class="section-label">Transform</div>

        <div class="slider-row">
          <div class="slider-header">
            <label>Size</label>
            <span class="val" id="val-size">20</span>
          </div>
          <input type="range" id="pat-size" min="4" max="80" value="20" oninput="onSlider('size',this.value)">
        </div>

        <div class="slider-row">
          <div class="slider-header">
            <label>Rotation</label>
            <span class="val" id="val-rot">0°</span>
          </div>
          <input type="range" id="pat-rot" min="0" max="359" value="0" oninput="onSlider('rot',this.value)">
        </div>

        <div class="slider-row">
          <div class="slider-header">
            <label>Offset X</label>
            <span class="val" id="val-ox">0</span>
          </div>
          <input type="range" id="pat-ox" min="-100" max="100" value="0" oninput="onSlider('ox',this.value)">
        </div>

        <div class="slider-row">
          <div class="slider-header">
            <label>Offset Y</label>
            <span class="val" id="val-oy">0</span>
          </div>
          <input type="range" id="pat-oy" min="-100" max="100" value="0" oninput="onSlider('oy',this.value)">
        </div>
      </div>
    </div>

// Reverse map: SVG element data-part value → PARTS key
const elementToPart = {};
Object.keys(PARTS).forEach(id => {
  const targets = PARTS[id].targets || ['part-' + id];
  targets.forEach(t => { elementToPart[t.replace('part-', '')] = id; });
});

// Per-part state
const state = {};
Object.keys(PARTS).forEach(id => {

    mode: 'solid',
    solidColor: PARTS[id].defaultFill,
    patType: 'hstripes',

let selected = null;
let activeTab = 'parts';

// ─────────────────────────────────────────────
// Pattern definitions
// Each function returns an object: { width, height, html }
// Coordinates are in the pre-transform SVG space (~0-200 range units)
// ─────────────────────────────────────────────
const PATTERNS = [
  { id: 'hstripes',    label: 'H. Stripes',   icon: iconHStripes },
  { id: 'vstripes',    label: 'V. Stripes',   icon: iconVStripes },
  { id: 'dstripes45',  label: 'Diag 45',      icon: iconDStripes45 },
  { id: 'dstripes135', label: 'Diag 135',     icon: iconDStripes135 },
  { id: 'grid',        label: 'Grid',         icon: iconGrid },
  { id: 'squares',     label: 'Squares',      icon: iconSquares },
  { id: 'diamonds',    label: 'Diamonds',     icon: iconDiamonds },
  { id: 'dots',        label: 'Dots',         icon: iconDots },
  { id: 'herringbone', label: 'Herringbone',  icon: iconHerringbone },
  { id: 'argyle',      label: 'Argyle',       icon: iconArgyle },
];

function makePatternSVG(id, s) {
  const sz = s.size;
  const c1 = s.c1;
  const c2 = s.c2;
  const ox = s.ox;
  const oy = s.oy;
  const rot = s.rot;

  let w, h, inner;

  switch (s.patType) {
    case 'hstripes':
      w = sz; h = sz;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <rect width="${w}" height="${h/2}" fill="${c2}"/>`;
      break;
    case 'vstripes':
      w = sz; h = sz;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <rect width="${w/2}" height="${h}" fill="${c2}"/>`;
      break;
    case 'dstripes45': {
      w = sz; h = sz;
      const sw = sz / 2;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <line x1="${-w}" y1="${h}" x2="${w}" y2="${-h}" stroke="${c2}" stroke-width="${sw}"/>
               <line x1="0" y1="${h}" x2="${w*2}" y2="${-h}" stroke="${c2}" stroke-width="${sw}"/>
               <line x1="${-w*2}" y1="${h}" x2="0" y2="${-h}" stroke="${c2}" stroke-width="${sw}"/>`;
      break;
    }
    case 'dstripes135': {
      w = sz; h = sz;
      const sw2 = sz / 2;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <line x1="0" y1="0" x2="${w*2}" y2="${h*2}" stroke="${c2}" stroke-width="${sw2}"/>
               <line x1="${-w}" y1="0" x2="${w}" y2="${h*2}" stroke="${c2}" stroke-width="${sw2}"/>
               <line x1="${w}" y1="0" x2="${w*3}" y2="${h*2}" stroke="${c2}" stroke-width="${sw2}"/>`;
      break;
    }
    case 'grid': {
      w = sz; h = sz;
      const lw = Math.max(sz * 0.08, 0.5);
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <rect width="${lw}" height="${h}" fill="${c2}"/>
               <rect width="${w}" height="${lw}" fill="${c2}"/>`;
      break;
    }
    case 'squares': {
      w = sz * 2; h = sz * 2;
      const m = sz * 0.15;
      const bs = sz - m * 2;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <rect x="${m}" y="${m}" width="${bs}" height="${bs}" fill="${c2}"/>
               <rect x="${sz+m}" y="${m}" width="${bs}" height="${bs}" fill="${c2}"/>
               <rect x="${m}" y="${sz+m}" width="${bs}" height="${bs}" fill="${c2}"/>
               <rect x="${sz+m}" y="${sz+m}" width="${bs}" height="${bs}" fill="${c2}"/>`;
      break;
    }
    case 'diamonds': {
      w = sz * 2; h = sz * 2;
      const hx = sz;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <polygon points="${hx},0 ${w},${hx} ${hx},${h} 0,${hx}" fill="${c2}"/>`;
      break;
    }
    case 'dots': {
      w = sz; h = sz;
      const r = sz * 0.35;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="${c2}"/>`;
      break;
    }
    case 'herringbone': {
      w = sz * 2; h = sz * 2;
      const sw3 = sz * 0.35;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <polyline points="0,${sz} ${sz},0 ${w},${sz}" stroke="${c2}" stroke-width="${sw3}" fill="none" stroke-linejoin="miter"/>
               <polyline points="0,${h} ${sz},${sz} ${w},${h}" stroke="${c2}" stroke-width="${sw3}" fill="none" stroke-linejoin="miter"/>
               <polyline points="${-sz},${sz} 0,0 ${sz},${sz}" stroke="${c2}" stroke-width="${sw3}" fill="none" stroke-linejoin="miter"/>
               <polyline points="${-sz},${h} 0,${sz} ${sz},${h}" stroke="${c2}" stroke-width="${sw3}" fill="none" stroke-linejoin="miter"/>`;
      break;
    }
    case 'argyle': {
      w = sz * 2; h = sz * 2;
      const lwa = sz * 0.04;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>
               <polygon points="${sz},0 ${w},${sz} ${sz},${h} 0,${sz}" fill="${c2}"/>
               <line x1="${sz}" y1="0" x2="${sz}" y2="${h}" stroke="${c1}" stroke-width="${lwa}"/>
               <line x1="0" y1="${sz}" x2="${w}" y2="${sz}" stroke="${c1}" stroke-width="${lwa}"/>`;
      break;
    }
    default:
      w = sz; h = sz;
      inner = `<rect width="${w}" height="${h}" fill="${c1}"/>`;
  }

  return { w, h, inner };
}

function buildPatternEl(patId, s) {
  const { w, h, inner } = makePatternSVG(patId, s);
  const ns = 'http://www.w3.org/2000/svg';
  const pat = document.createElementNS(ns, 'pattern');
  pat.setAttribute('id', patId);
  pat.setAttribute('patternUnits', 'userSpaceOnUse');
  pat.setAttribute('width', w);
  pat.setAttribute('height', h);
  pat.setAttribute('patternTransform', `translate(${s.ox},${s.oy}) rotate(${s.rot})`);
  pat.innerHTML = inner;
  return pat;
}

// ─────────────────────────────────────────────
// Swatch updater
// ─────────────────────────────────────────────
function updateSwatch(id) {
  const sw = document.getElementById('sw-' + id);
  if (!sw) return;
  const s = state[id];
  if (s.mode === 'solid') {
    sw.style.background = s.solidColor;
  } else {
    // Show a gradient/stripe preview
    sw.style.background = `linear-gradient(45deg, ${s.c1} 50%, ${s.c2} 50%)`;
  }
}

// ─────────────────────────────────────────────
// Apply fill to SVG element
// ─────────────────────────────────────────────
function getTargetGroups(id) {
  const targets = PARTS[id].targets || ['part-' + id];
  return targets.map(t => document.getElementById(t)).filter(Boolean);
}

function applyFill(id) {
  const groups = getTargetGroups(id);
  if (!groups.length) return;
  const s = state[id];
  const shapes = groups.flatMap(g => [...g.querySelectorAll('path, ellipse, rect, circle, polygon, polyline')]);

  if (s.mode === 'solid') {
    removePatternDef(id);
    if (PARTS[id].strokeOnly) {
      shapes.forEach(el => el.style.stroke = s.solidColor);
    } else {
      shapes.forEach(el => el.style.fill = s.solidColor);
    }
  } else {
    const patId = 'pat-' + id;
    removePatternDef(id);

    const patEl = buildPatternEl(patId, s);
    const wrapper = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    wrapper.id = 'patdef-' + id;
    wrapper.appendChild(patEl);
    document.getElementById('svg-defs').appendChild(wrapper);

    if (PARTS[id].strokeOnly) {
      shapes.forEach(el => el.style.stroke = `url(#${patId})`);
    } else {
      shapes.forEach(el => el.style.fill = `url(#${patId})`);
    }
  }

  updateSwatch(id);
}

function removePatternDef(id) {
  const old = document.getElementById('patdef-' + id);
  if (old) old.remove();
}

// ─────────────────────────────────────────────
// Selection
// ─────────────────────────────────────────────
function selectPart(id) {
  // Deselect old
  if (selected) {
    document.getElementById('listbtn-' + selected)?.classList.remove('active');
  }
  selected = id;
  document.getElementById('listbtn-' + id)?.classList.add('active');

  // Switch to edit tab
  switchTab('edit');

  // Populate edit panel
  document.getElementById('no-selection').style.display = 'none';
  document.getElementById('edit-controls').style.display = 'block';
  document.getElementById('edit-title').textContent = PARTS[id].label;

  const s = state[id];
  // Mode buttons
  document.getElementById('mode-solid').classList.toggle('active', s.mode === 'solid');
  document.getElementById('mode-pattern').classList.toggle('active', s.mode === 'pattern');
  document.getElementById('solid-section').style.display = s.mode === 'solid' ? 'block' : 'none';
  document.getElementById('pattern-section').style.display = s.mode === 'pattern' ? 'block' : 'none';

  // Solid color — populate canvas picker
  setPickerFromHex(toHex(s.solidColor));

  // Preset palette
  const part = PARTS[id];
  const presetPalette = document.getElementById('preset-palette');
  const pickerSection = document.getElementById('color-picker-section');
  const fillTypeSection = document.getElementById('fill-type-section');
  if (part.presets) {
    presetPalette.style.display = 'block';
    const container = document.getElementById('preset-swatches');
    container.innerHTML = '';
    const currentHex = toHex(s.solidColor).toLowerCase();
    part.presets.forEach(p => {
      const color = typeof p === 'string' ? p : p.color;
      const label = typeof p === 'string' ? null : p.label;
      const sw = document.createElement('div');
      sw.className = 'preset-swatch';
      sw.style.background = color;
      if (label) sw.title = label;
      if (currentHex === color.toLowerCase()) sw.classList.add('active');
      sw.onclick = () => {
        container.querySelectorAll('.preset-swatch').forEach(x => x.classList.remove('active'));
        sw.classList.add('active');
        pickPreset(color);
      };
      container.appendChild(sw);
    });
  } else {
    presetPalette.style.display = 'none';
  }
  pickerSection.style.display = part.presetsOnly ? 'none' : 'block';
  fillTypeSection.style.display = part.presetsOnly ? 'none' : 'block';

  // Pattern
  document.getElementById('pat-c1').value = s.c1;
  document.getElementById('pat-c2').value = s.c2;
  document.getElementById('pat-size').value = s.size;
  document.getElementById('pat-rot').value = s.rot;
  document.getElementById('pat-ox').value = s.ox;
  document.getElementById('pat-oy').value = s.oy;
  document.getElementById('val-size').textContent = s.size;
  document.getElementById('val-rot').textContent = s.rot + '°';
  document.getElementById('val-ox').textContent = s.ox;
  document.getElementById('val-oy').textContent = s.oy;

  // Highlight active pattern thumb
  document.querySelectorAll('.pat-thumb').forEach(b => {
    b.classList.toggle('active', b.dataset.pat === s.patType);
  });

  // Update selection highlight
  updateSelectionHighlight(id);
}

function updateSelectionHighlight(id) {
  const hl = document.getElementById('selection-highlight');
  const u = document.getElementById('sel-use');
  if (!id) {
    hl.style.display = 'none';
    return;
  }
  // Clone the shape paths from the part and draw them with a highlight stroke
  hl.style.display = 'block';
  // Remove old highlight children (except the use element)
  while (hl.firstChild) hl.removeChild(hl.firstChild);

  const groups = getTargetGroups(id);
  if (!groups.length) return;
  groups.forEach(srcG => srcG.querySelectorAll('path, ellipse').forEach(origEl => {
    const clone = origEl.cloneNode(false);
    clone.style.fill = 'none';
    clone.style.stroke = '#00d4ff';
    clone.style.strokeWidth = '3px';
    clone.style.vectorEffect = 'non-scaling-stroke';
    clone.style.opacity = '0.9';
    hl.appendChild(clone);
  }));
}

  document.getElementById('pattern-section').style.display = mode === 'pattern' ? 'block' : 'none';

}

function onSolidColorChange(val) {

// ─── Canvas Color Picker ──────────────────────
const pickerHSV = { h: 0, s: 1, v: 1 };

function hsvToRgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r=0,g=0,b=0;
  if      (h < 60)  { r=c; g=x; b=0; }
  else if (h < 120) { r=x; g=c; b=0; }
  else if (h < 180) { r=0; g=c; b=x; }
  else if (h < 240) { r=0; g=x; b=c; }
  else if (h < 300) { r=x; g=0; b=c; }
  else              { r=c; g=0; b=x; }
  return { r: Math.round((r+m)*255), g: Math.round((g+m)*255), b: Math.round((b+m)*255) };
}

function rgbToHsv(r, g, b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0, s=max===0?0:d/max, v=max;
  if (d) {
    switch(max) {
      case r: h=((g-b)/d+(g<b?6:0))/6; break;
      case g: h=((b-r)/d+2)/6; break;
      case b: h=((r-g)/d+4)/6; break;
    }
  }
  return { h: h*360, s, v };
}

function rgbToHex(r,g,b) {
  return '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
}

function hexToRgbObj(hex) {
  return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
}

function drawSVCanvas() {
  const canvas = document.getElementById('sv-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = `hsl(${pickerHSV.h},100%,50%)`;
  ctx.fillRect(0,0,W,H);
  const wg = ctx.createLinearGradient(0,0,W,0);
  wg.addColorStop(0,'rgba(255,255,255,1)');
  wg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = wg; ctx.fillRect(0,0,W,H);
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'rgba(0,0,0,0)');
  bg.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  updateSVHandle();
}

function drawHueBar() {
  const canvas = document.getElementById('hue-strip');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const grad = ctx.createLinearGradient(0,0,W,0);
  for (let i=0;i<=360;i+=30) grad.addColorStop(i/360,`hsl(${i},100%,50%)`);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  updateHueHandle();
}

function updateSVHandle() {
  const canvas = document.getElementById('sv-canvas');
  const handle = document.getElementById('sv-handle');
  if (!canvas||!handle) return;
  handle.style.left = (pickerHSV.s * canvas.offsetWidth) + 'px';
  handle.style.top  = ((1-pickerHSV.v) * canvas.offsetHeight) + 'px';
}

function updateHueHandle() {
  const canvas = document.getElementById('hue-strip');
  const handle = document.getElementById('hue-handle');
  if (!canvas||!handle) return;
  handle.style.left = ((pickerHSV.h/360) * canvas.offsetWidth) + 'px';
}

function syncPickerFromHSV() {
  const {r,g,b} = hsvToRgb(pickerHSV.h, pickerHSV.s, pickerHSV.v);
  const hex = rgbToHex(r,g,b);
  document.getElementById('inp-r').value = r;
  document.getElementById('inp-g').value = g;
  document.getElementById('inp-b').value = b;
  const pre = document.getElementById('picker-preview-circle');
  if (pre) pre.style.background = hex;
  document.getElementById('solid-color').value = hex;
  updateSVHandle();
  updateHueHandle();
  if (!selected) return;
  state[selected].solidColor = hex;
  applyFill(selected);
}

function setPickerFromHex(hex) {
  if (!hex||hex==='none') hex='#000000';
  const {r,g,b} = hexToRgbObj(hex);
  const {h,s,v} = rgbToHsv(r,g,b);
  pickerHSV.h=h; pickerHSV.s=s; pickerHSV.v=v;
  drawSVCanvas();
  drawHueBar();
  document.getElementById('inp-r').value = r;
  document.getElementById('inp-g').value = g;
  document.getElementById('inp-b').value = b;
  const pre = document.getElementById('picker-preview-circle');
  if (pre) pre.style.background = hex;
  document.getElementById('solid-color').value = hex;
}

function onRgbInput() {
  const r = Math.min(255,Math.max(0,+document.getElementById('inp-r').value||0));
  const g = Math.min(255,Math.max(0,+document.getElementById('inp-g').value||0));
  const b = Math.min(255,Math.max(0,+document.getElementById('inp-b').value||0));
  const {h,s,v} = rgbToHsv(r,g,b);
  pickerHSV.h=h; pickerHSV.s=s; pickerHSV.v=v;
  const hex = rgbToHex(r,g,b);
  const pre = document.getElementById('picker-preview-circle');
  if (pre) pre.style.background = hex;
  document.getElementById('solid-color').value = hex;
  drawSVCanvas(); updateSVHandle(); updateHueHandle();
  if (!selected) return;
  state[selected].solidColor = hex;
  applyFill(selected);
}

function onColorWheelChange(val) {
  setPickerFromHex(val);
  if (!selected) return;
  state[selected].solidColor = val;
  applyFill(selected);
}

function pickPreset(color) {
  if (!selected) return;
  state[selected].solidColor = color;
  setPickerFromHex(color);
  applyFill(selected);
}

function initCanvasPicker() {
  const svCanvas = document.getElementById('sv-canvas');
  const hueCanvas = document.getElementById('hue-strip');
  if (!svCanvas||!hueCanvas) return;

  let draggingSV = false, draggingHue = false;

  function pickSV(e) {
    const rect = svCanvas.getBoundingClientRect();
    pickerHSV.s = Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    pickerHSV.v = 1-Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));
    syncPickerFromHSV();
  }
  function pickHue(e) {
    const rect = hueCanvas.getBoundingClientRect();
    pickerHSV.h = Math.max(0,Math.min(360,(e.clientX-rect.left)/rect.width*360));
    drawSVCanvas(); syncPickerFromHSV();
  }

  svCanvas.addEventListener('mousedown', e=>{ draggingSV=true; pickSV(e); });
  hueCanvas.addEventListener('mousedown', e=>{ draggingHue=true; pickHue(e); });
  document.addEventListener('mousemove', e=>{ if(draggingSV) pickSV(e); if(draggingHue) pickHue(e); });
  document.addEventListener('mouseup', ()=>{ draggingSV=false; draggingHue=false; });

  // Touch support
  svCanvas.addEventListener('touchstart', e=>{ draggingSV=true; pickSV(e.touches[0]); e.preventDefault(); },{passive:false});
  hueCanvas.addEventListener('touchstart', e=>{ draggingHue=true; pickHue(e.touches[0]); e.preventDefault(); },{passive:false});
  document.addEventListener('touchmove', e=>{ if(draggingSV) pickSV(e.touches[0]); if(draggingHue) pickHue(e.touches[0]); },{passive:false});
  document.addEventListener('touchend', ()=>{ draggingSV=false; draggingHue=false; });
}

function onPatternChange() {
  if (!selected) return;
  const s = state[selected];
  s.c1 = document.getElementById('pat-c1').value;
  s.c2 = document.getElementById('pat-c2').value;
  applyFill(selected);
}

function onSlider(prop, val) {
  if (!selected) return;
  const num = parseFloat(val);
  if (prop === 'size') {
    state[selected].size = num;
    document.getElementById('val-size').textContent = num;
  } else if (prop === 'rot') {
    state[selected].rot = num;
    document.getElementById('val-rot').textContent = num + '°';
  } else if (prop === 'ox') {
    state[selected].ox = num;
    document.getElementById('val-ox').textContent = num;
  } else if (prop === 'oy') {
    state[selected].oy = num;
    document.getElementById('val-oy').textContent = num;
  }
  if (state[selected].mode === 'pattern') applyFill(selected);
}

// ─────────────────────────────────────────────
// Tab switching
// ─────────────────────────────────────────────
function switchTab(name) {
  activeTab = name;
  document.getElementById('tab-parts').style.display = name === 'parts' ? 'flex' : 'none';
  document.getElementById('tab-parts').style.flexDirection = 'column';
  document.getElementById('tab-edit').style.display = name === 'edit' ? 'flex' : 'none';
  document.getElementById('tab-edit').style.flexDirection = 'column';
  document.getElementById('tab-btn-parts').classList.toggle('active', name === 'parts');
  document.getElementById('tab-btn-edit').classList.toggle('active', name === 'edit');

  if (name === 'parts') {
    document.getElementById('tab-parts').style.display = '';
    document.getElementById('tab-edit').style.display = 'none';
  } else {
    document.getElementById('tab-parts').style.display = 'none';
    document.getElementById('tab-edit').style.display = '';
    // Redraw canvas now that it's visible and has layout dimensions
    requestAnimationFrame(() => { drawSVCanvas(); drawHueBar(); });
  }
}

// ─────────────────────────────────────────────
// Reset
// ─────────────────────────────────────────────
function resetAll() {
  Object.keys(PARTS).forEach(id => {
    state[id] = {
      mode: 'solid',
      solidColor: PARTS[id].defaultFill,
      patType: 'hstripes',
      c1: '#ffffff',
      c2: '#cc0000',
      size: 20,
      rot: 0,
      ox: 0,
      oy: 0,
    };
    removePatternDef(id);
    const g = document.getElementById('part-' + id);
    if (g) {
      g.querySelectorAll('path, ellipse').forEach(el => {
        el.style.fill = PARTS[id].defaultFill;
      });
    }
    updateSwatch(id);
  });
  if (selected) selectPart(selected);
}

// ─────────────────────────────────────────────
// Export
// ─────────────────────────────────────────────
function exportSVG() {
  const svg = document.getElementById('jockey-svg').cloneNode(true);
  // Remove selection highlight from clone
  const hl = svg.querySelector('#selection-highlight');
  if (hl) hl.remove();
  const blob = new Blob([
    '<?xml version="1.0" encoding="UTF-8"?>\n' + svg.outerHTML
  ], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jockey-design.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ─────────────────────────────────────────────
// Utility
// ─────────────────────────────────────────────
function toHex(color) {
  if (!color || color === 'none') return '#000000';
  if (color.startsWith('#') && color.length === 7) return color;
  const tmp = document.createElement('canvas').getContext('2d');
  tmp.fillStyle = color;
  const c = tmp.fillStyle; // browser normalizes to #rrggbb
  return c.length === 7 ? c : color;
}

// ─────────────────────────────────────────────
// Build pattern picker UI
// ─────────────────────────────────────────────
function buildPatternGrid() {
  const grid = document.getElementById('pattern-grid');
  PATTERNS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'pat-thumb';
    div.dataset.pat = p.id;
    div.title = p.label;
    div.innerHTML = p.icon() + `<span>${p.label}</span>`;
    div.onclick = () => {
      if (!selected) return;
      document.querySelectorAll('.pat-thumb').forEach(b => b.classList.remove('active'));
      div.classList.add('active');
      state[selected].patType = p.id;
      applyFill(selected);
    };
    grid.appendChild(div);
  });
}

// ─────────────────────────────────────────────
// Click on SVG parts
// ─────────────────────────────────────────────
function setupSVGClicks() {
  document.querySelectorAll('[data-part]').forEach(g => {
    g.addEventListener('click', e => {
      e.stopPropagation();
      const partId = elementToPart[g.dataset.part] || g.dataset.part;
      selectPart(partId);
    });
  });

  // Click on canvas background deselects
  document.getElementById('canvas-area').addEventListener('click', () => {
    if (selected) {
      document.getElementById('listbtn-' + selected)?.classList.remove('active');
      selected = null;
      const hl = document.getElementById('selection-highlight');
      if (hl) { hl.style.display = 'none'; while (hl.firstChild) hl.removeChild(hl.firstChild); }
      document.getElementById('no-selection').style.display = 'block';
      document.getElementById('edit-controls').style.display = 'none';
    }
  });
}

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
function init() {
  buildPatternGrid();
  setupSVGClicks();
  // Initialize swatches
  Object.keys(PARTS).forEach(id => updateSwatch(id));
  // Initialize canvas color picker
  initCanvasPicker();
  drawSVCanvas();
  drawHueBar();
  // Start on parts tab
  switchTab('parts');
}

init();

// ─────────────────────────────────────────────
// Logo overlay — drag, scale, rotate
// ─────────────────────────────────────────────
const logoState = { visible: false, x: 980, y: 820, scale: 18, rot: 0, fill: '#ffffff' };

function updateLogoTransform() {
  const drag = document.getElementById('logo-drag');
  if (!drag) return;
  const s = logoState.scale / 100;
  // SVG transform order: translate first, then rotate around logo centre (320,206), then scale
  drag.setAttribute('transform',
    `translate(${logoState.x},${logoState.y}) rotate(${logoState.rot},320,206) scale(${s})`
  );
}

function toggleLogo(show) {
  logoState.visible = show;
  document.getElementById('logo-layer').style.display = show ? '' : 'none';
  document.getElementById('logo-show-btn').classList.toggle('active', show);
  document.getElementById('logo-hide-btn').classList.toggle('active', !show);
}

function onLogoColor(val) {
  logoState.fill = val;
  document.getElementById('logo-path').style.fill = val;
}

function onLogoSlider() {
  logoState.scale = +document.getElementById('logo-scale').value;
  logoState.rot   = +document.getElementById('logo-rot').value;
  logoState.x     = +document.getElementById('logo-x').value;
  logoState.y     = +document.getElementById('logo-y').value;
  document.getElementById('val-logo-scale').textContent = logoState.scale + '%';
  document.getElementById('val-logo-rot').textContent   = logoState.rot + '°';
  document.getElementById('val-logo-x').textContent     = Math.round(logoState.x);
  document.getElementById('val-logo-y').textContent     = Math.round(logoState.y);
  updateLogoTransform();
}

function syncLogoSlidersFromState() {
  document.getElementById('logo-scale').value = logoState.scale;
  document.getElementById('logo-rot').value   = logoState.rot;
  document.getElementById('logo-x').value     = logoState.x;
  document.getElementById('logo-y').value     = logoState.y;
  document.getElementById('val-logo-scale').textContent = logoState.scale + '%';
  document.getElementById('val-logo-rot').textContent   = logoState.rot + '°';
  document.getElementById('val-logo-x').textContent     = Math.round(logoState.x);
  document.getElementById('val-logo-y').textContent     = Math.round(logoState.y);
}

// ── Drag handling ──
(function setupLogoDrag() {
  const svg    = document.getElementById('jockey-svg');
  const drag   = document.getElementById('logo-drag');
  const hitbox = document.getElementById('logo-hitbox');
  let dragging = false;
  let startSVG = null;   // SVG coords at pointer-down
  let startPos = null;   // logoState {x,y} at pointer-down

  function svgPoint(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function onDown(e) {
    if (!logoState.visible) return;
    e.stopPropagation();
    dragging  = true;
    startSVG  = svgPoint(e);
    startPos  = { x: logoState.x, y: logoState.y };
    svg.style.userSelect = 'none';
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
  }

  function onMove(e) {
    if (!dragging) return;
    const cur = svgPoint(e);
    logoState.x = startPos.x + (cur.x - startSVG.x);
    logoState.y = startPos.y + (cur.y - startSVG.y);
    updateLogoTransform();
    syncLogoSlidersFromState();
  }

  function onUp() {
    dragging = false;
    svg.style.userSelect = '';
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup',   onUp);
  }

  drag.addEventListener('mousedown', onDown);
})();

// Hook logo tab into switchTab
const _origSwitchTab = switchTab;
// patch: switchTab already handles 'logo' via the generic tab mechanism below
// Override to handle the logo tab content div
const origSwitchTab = switchTab;
window.switchTab = function(name) {

    document.getElementById('tab-btn-edit').classList.remove('active');

  } else {
    logoTab.style.display = 'none';
    document.getElementById('tab-btn-logo').classList.remove('active');
    origSwitchTab(name);
  }
};
